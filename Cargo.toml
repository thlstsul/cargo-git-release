[package]
name = "cargo-git-release"
version = "0.2.2"
description = "A cargo subcommand to release crates to git"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thlstsul/cargo-git-release"

[[bin]]
name = "cargo-git-release"
path = "src/bin/cargo-git-release.rs"

[[bin]]
name = "git-release"
path = "src/bin/cargo-git-release.rs"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
serde_json = "1.0.154"
toml = "1.2.1"
walkdir = "2.5.0"

[dependencies.clap]
features = ["derive"]
version = "4.6.7"

[dependencies.serde]
features = ["derive"]
version = "1.0.229"
